<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover — Traveloop</title>
  <link rel="stylesheet" href="global.css">
  <style>
    .discover-header {
      margin-bottom: 24px;
    }
    .discover-controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .map-container {
      width: 100%;
      height: 600px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-sm);
      background: var(--bg-card);
      position: relative;
    }
    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .map-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<div id="page-loader" class="page-loader"><div class="spinner"></div></div>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main-content">
    <div class="discover-header">
      <h1 style="font-family: var(--font-display); font-size: 32px; font-weight: 800; margin-bottom: 8px;">Discover Places</h1>
      <p style="color: var(--text-muted);">Explore locations, restaurants, and attractions for your trips.</p>
    </div>

    <div class="discover-controls">
      <div class="form-group" style="flex: 1; min-width: 200px;">
        <label class="form-label">Select Trip</label>
        <select id="trip-select" class="form-input" onchange="updateMap()">
          <option value="">-- Choose a Trip --</option>
        </select>
      </div>

      <div class="form-group" style="flex: 1; min-width: 200px;">
        <label class="form-label">Category</label>
        <select id="category-select" class="form-input" onchange="updateMap()">
          <option value="Places to visit">Attractions & Places</option>
          <option value="Restaurants">Restaurants & Food</option>
          <option value="Hotels">Hotels & Stays</option>
          <option value="Shopping">Shopping & Malls</option>
        </select>
      </div>
    </div>

    <div class="map-container" id="map-wrapper">
      <div class="map-overlay" id="map-overlay">
        Please select a trip to discover places around its destination.
      </div>
      <iframe id="google-map" src="" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</div>

<template id="sidebar-template">
  <!-- Sidebar content -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">✈️</div><span class="logo-text">TRAVELOOP</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <a href="dashboard.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
        <a href="trips.html" class="nav-link"><span class="icon">🗺️</span> My Trips</a>
        <a href="create_trip.html" class="nav-link"><span class="icon">➕</span> New Trip</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Explore</div>
        <a href="discover.html" class="nav-link active"><span class="icon">🌐</span> Discover</a>
        <a href="ai_planner.html" class="nav-link"><span class="icon">🤖</span> AI Planner</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Account</div>
        <a href="profile.html" class="nav-link"><span class="icon">👤</span> Profile</a>
        <a href="#" class="nav-link" onclick="Auth.logout()"><span class="icon">🚪</span> Sign Out</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <a href="profile.html" class="user-mini" style="text-decoration:none;">
        <div class="user-avatar" id="sidebar-user-avatar">T</div>
        <div class="user-info">
          <div class="user-name truncate" id="sidebar-user-name">Loading...</div>
          <div class="user-role">Explorer</div>
        </div>
      </a>
    </div>
  </aside>
</template>

<script src="utils.js"></script>
<script>
  let trips = [];

  (async () => {
    document.getElementById('sidebar-mount').innerHTML = document.getElementById('sidebar-template').innerHTML;
    initSidebar();
    
    const user = await Auth.requireAuth();
    if (!user) return;
    renderUserInSidebar(user);

    await loadTrips();
    document.getElementById('page-loader').style.display = 'none';
  })();

  async function loadTrips() {
    try {
      trips = await API.get('/api/trips');
      const select = document.getElementById('trip-select');
      
      // We need to fetch details for each trip to get the stops (destinations)
      // For simplicity, we can just fetch the stops when a trip is selected, or we can use the trip title as a fallback.
      
      trips.forEach(trip => {
        const opt = document.createElement('option');
        opt.value = trip.id;
        opt.textContent = trip.title;
        select.appendChild(opt);
      });
    } catch (err) {
      Toast.error('Failed to load trips');
    }
  }

  async function updateMap() {
    const tripId = document.getElementById('trip-select').value;
    const category = document.getElementById('category-select').value;
    const overlay = document.getElementById('map-overlay');
    const iframe = document.getElementById('google-map');

    if (!tripId) {
      overlay.style.display = 'flex';
      overlay.textContent = 'Please select a trip to discover places around its destination.';
      iframe.src = '';
      return;
    }

    overlay.style.display = 'flex';
    overlay.innerHTML = '<div class="spinner"></div><div style="margin-top:15px;">Loading map...</div>';

    try {
      // Fetch full trip details to get the destination city
      const tripDetail = await API.get(`/api/trips/${tripId}`);
      
      let locationQuery = tripDetail.title; // fallback
      if (tripDetail.stops && tripDetail.stops.length > 0) {
        // Use the first stop as the primary destination
        locationQuery = `${tripDetail.stops[0].city}, ${tripDetail.stops[0].country}`;
      }

      // Format query for Google Maps iframe
      // We use the Embed API fallback (q=) which works without an API key for basic searches
      const query = encodeURIComponent(`${category} in ${locationQuery}`);
      iframe.src = `https://maps.google.com/maps?q=${query}&output=embed`;

      // Hide overlay after a short delay to allow iframe to load
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 1000);

    } catch (err) {
      overlay.textContent = 'Failed to load trip location.';
    }
  }
</script>
</body>
</html>
