<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Traveloop</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background: var(--bg-deep);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .not-found {
      max-width: 400px;
      padding: 40px;
    }
    .not-found h1 {
      font-size: 80px;
      font-family: var(--font-display);
      margin-bottom: 10px;
      color: var(--brand-purple);
    }
    .not-found p {
      color: var(--text-muted);
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <h1>404</h1>
    <h2>Lost your way?</h2>
    <p>We couldn't find the page you're looking for. Let's get you back on track.</p>
    <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
  </div>
</body>
</html>
